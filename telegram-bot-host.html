<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة بوت Telegram | OSKAR STORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Cairo',sans-serif}.ltr{direction:ltr;text-align:left}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <main class="max-w-4xl mx-auto space-y-6">
    <header class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex flex-col md:flex-row gap-4 items-center justify-between shadow-xl">
      <div>
        <h1 class="text-2xl font-extrabold text-sky-400">OSKAR STORE</h1>
        <p class="text-xs text-slate-400 mt-1">استضافة البوت واكتشاف المستخدمين تلقائياً بالـ @username</p>
      </div>
      <div id="botBadge" class="px-4 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs">جاري فحص البوت...</div>
    </header>

    <section class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="font-bold">👥 المستخدمون المكتشفون</h2>
          <span id="userCount" class="text-xs bg-sky-500/15 text-sky-300 px-2 py-1 rounded-full">0</span>
        </div>
        <p class="text-[11px] leading-5 text-slate-400">يتم الجلب تلقائياً كل 10 ثوانٍ. يظهر فقط من سبق له فتح البوت والضغط على <b>/start</b> أو إرسال رسالة.</p>
        <div id="usersList" class="space-y-2 max-h-[420px] overflow-y-auto"></div>
      </div>

      <div class="lg:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-5">
        <h2 class="font-bold border-b border-slate-800 pb-3">💬 إرسال باليوزر فقط</h2>
        <div>
          <label class="text-xs text-slate-300 block mb-1">Telegram username</label>
          <input id="username" class="ltr w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 outline-none focus:border-sky-500 font-mono" placeholder="@username" autocomplete="off" />
        </div>
        <div>
          <label class="text-xs text-slate-300 block mb-1">نص الرسالة</label>
          <textarea id="message" rows="7" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 outline-none focus:border-sky-500 resize-none" placeholder="اكتب الرسالة..."></textarea>
        </div>
        <button id="sendBtn" onclick="sendByUsername()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold">إرسال الآن</button>
        <div id="status" class="hidden p-3 rounded-xl text-sm text-center"></div>
      </div>
    </section>
  </main>

<script>
  let knownUsers = [];
  const qs = id => document.getElementById(id);
  function status(msg, ok=true){
    const el=qs('status'); el.className=`p-3 rounded-xl text-sm text-center ${ok?'bg-emerald-500/15 text-emerald-300 border border-emerald-500/20':'bg-rose-500/15 text-rose-300 border border-rose-500/20'}`; el.textContent=msg;
  }
  async function api(url, body={}){
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.ok===false) throw new Error(data.error||`HTTP ${res.status}`);
    return data;
  }
  async function checkBot(){
    try{
      const d=await api('./api/telegram',{method:'getMe',payload:{}});
      qs('botBadge').innerHTML=`<span class="text-emerald-400">● متصل</span> <b>${d.result?.first_name||'Telegram Bot'}</b> <span class="text-sky-400 font-mono">@${d.result?.username||''}</span>`;
    }catch(e){ qs('botBadge').textContent='تعذر الاتصال بالبوت'; }
  }
  function renderUsers(){
    qs('userCount').textContent=knownUsers.length;
    if(!knownUsers.length){qs('usersList').innerHTML='<div class="text-center text-xs text-slate-500 py-6">لا يوجد مستخدمون بعد.</div>';return;}
    qs('usersList').innerHTML=knownUsers.map(u=>`<button class="w-full text-right p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-sky-600" data-user="${(u.username||'').replace(/"/g,'&quot;')}"><div class="font-bold text-xs">${u.name||'بدون اسم'}</div><div class="text-sky-400 font-mono text-[11px]">${u.username||''}</div></button>`).join('');
    qs('usersList').querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{qs('username').value=b.dataset.user||'';});
  }
  async function refreshUsers(){
    try{ const d=await api('./api/telegram/users',{}); knownUsers=Array.isArray(d.users)?d.users:[]; renderUsers(); }catch(e){}
  }
  async function sendByUsername(){
    const username=(qs('username').value||'').trim(); const text=(qs('message').value||'').trim();
    if(!username || !text) return status('اكتب اليوزر ونص الرسالة',false);
    const btn=qs('sendBtn'); btn.disabled=true; btn.textContent='جاري الإرسال...';
    try{
      const resolved=await api('./api/telegram/resolve',{username});
      await api('./api/telegram',{method:'sendMessage',payload:{chat_id:resolved.result.chatId,text,disable_web_page_preview:true}});
      status(`تم الإرسال إلى ${resolved.result.username||username} ✅`,true); qs('message').value='';
    }catch(e){status(e.message||'فشل الإرسال',false)}
    finally{btn.disabled=false;btn.textContent='إرسال الآن'}
  }
  checkBot(); refreshUsers(); setInterval(refreshUsers,10000);
</script>
</body>
</html>
