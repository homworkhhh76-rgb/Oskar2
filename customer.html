<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,Arial,sans-serif;background:#f5f7fb;color:#0f172a}body{padding-bottom:28px}.shell{max-width:620px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,#047857,#059669 65%,#10b981);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 44px;border-radius:0 0 28px 28px;box-shadow:0 14px 32px rgba(5,150,105,.18)}.brand{display:flex;align-items:center;gap:12px}.logo{width:62px;height:62px;border-radius:18px;background:#fff;padding:5px;object-fit:contain;box-shadow:0 8px 18px rgba(0,0,0,.12)}.brand h1{font-size:18px;margin:0;font-weight:900}.brand p{margin:3px 0 0;font-size:11px;opacity:.85}.refresh{margin-right:auto;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 10px;font-family:inherit;font-weight:800;font-size:11px}.customer{margin-top:24px}.hello{font-size:12px;opacity:.82}.customer-name{font-size:24px;font-weight:900;margin-top:2px}.content{padding:0 14px;margin-top:-25px}.balance-card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(15,23,42,.09);border:1px solid #edf2f7}.balance-label{font-size:11px;color:#64748b;font-weight:700}.balance{font-size:31px;line-height:1.3;font-weight:900;margin-top:5px;direction:ltr;text-align:right}.balance.debt{color:#dc2626}.balance.credit{color:#059669}.balance.zero{color:#475569}.balance-note{font-size:11px;color:#64748b;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#fff;border:1px solid #e8edf3;border-radius:16px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#64748b}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0 10px}.tab{border:1px solid #e2e8f0;background:#fff;border-radius:13px;padding:9px 6px;font-family:inherit;font-weight:800;font-size:11px;color:#475569}.tab.active{background:#059669;color:#fff;border-color:#059669}.section{display:none}.section.active{display:block}.section-title{font-size:13px;font-weight:900;margin:14px 2px 9px}.list{display:flex;flex-direction:column;gap:9px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:17px;padding:13px;box-shadow:0 4px 14px rgba(15,23,42,.035)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#64748b;font-size:10px}.strong{font-size:12px;font-weight:900}.amount{font-size:14px;font-weight:900;direction:ltr}.red{color:#dc2626}.green{color:#059669}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900}.badge.sale{background:#eff6ff;color:#2563eb}.badge.return{background:#fff1f2;color:#e11d48}.badge.receipt{background:#ecfdf5;color:#059669}.badge.payment{background:#fff7ed;color:#ea580c}.invoice-toggle{width:100%;border:0;background:transparent;font-family:inherit;text-align:inherit;padding:0;color:inherit}.details{display:none;border-top:1px dashed #e2e8f0;margin-top:10px;padding-top:10px}.details.open{display:block}.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9}.item:last-child{border-bottom:0}.item-name{font-size:10px;font-weight:800}.item-meta{font-size:9px;color:#64748b;margin-top:2px}.item-total{font-size:10px;font-weight:900;direction:ltr}.notes{margin-top:9px;background:#f8fafc;border-radius:10px;padding:8px;font-size:9px;color:#475569}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:28px;text-align:center;color:#94a3b8;font-size:11px}.loading,.error{max-width:480px;margin:28vh auto 0;padding:24px;text-align:center}.spinner{width:38px;height:38px;border:4px solid #d1fae5;border-top-color:#059669;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.error-box{background:#fff;border:1px solid #fecaca;border-radius:18px;padding:18px;color:#991b1b}.footer{text-align:center;color:#94a3b8;font-size:9px;padding:22px 10px 0}.last-update{font-size:9px;color:#94a3b8;text-align:center;margin-top:11px}@media(min-width:700px){.shell{padding:16px}.top{border-radius:28px}.content{padding:0 24px}.logo{width:70px;height:70px}}
